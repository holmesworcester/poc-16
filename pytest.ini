[pytest]
markers =
    unit: deterministic local contract or fault-injection evidence
    live: opt-in direct-provider conformance evidence; never emulator proof
    live_s3: opt-in Amazon S3 direct-API conformance evidence
    live_r2: opt-in Cloudflare R2 direct-API conformance evidence
    live_pubsub: opt-in Google Pub/Sub direct-API conformance evidence
    emulator: opt-in official local service emulator evidence
    soak: long-running seeded adversarial schedules excluded from ordinary CI
