AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: POC-16 database-free RepositoryApplier over S3

Parameters:
  DeploymentId:
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,63}$"
  WorkspaceId:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
  CanonicalBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
  CanonicalPrefix:
    Type: String
    MinLength: 1
    MaxLength: 760
    AllowedPattern: '^[a-z0-9:_-][a-z0-9:._-]*(?:/[a-z0-9:_-][a-z0-9:._-]*)*$'
  IngressBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
  ExpectedBucketOwner:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
  LogRetentionDays:
    Type: Number
    Default: 14
  KmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(?:aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  RepositoryApplierRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApplyOneWorkspaceRepository
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverCanonicalWork
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${CanonicalBucketName}"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
                  StringLike:
                    s3:prefix:
                      - !Sub "${CanonicalPrefix}/pile/*"
              - Sid: DistinguishMissingCanonicalKeys
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${CanonicalBucketName}"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
                  StringLike:
                    s3:prefix:
                      - !Sub "${CanonicalPrefix}/root"
                      - !Sub "${CanonicalPrefix}/obj/*"
                      - !Sub "${CanonicalPrefix}/applier/*"
                      - !Sub "${CanonicalPrefix}/staged/*"
                  NumericLessThanEquals:
                    s3:max-keys: 1
              - Sid: DiscoverStagedPileMarkers
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${IngressBucketName}"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
                  StringLike:
                    s3:prefix:
                      - !Sub
                        "ingress/v1/workspaces/${WorkspaceId}/piles/*"
              - Sid: DistinguishMissingIngressObjects
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${IngressBucketName}"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
                  StringLike:
                    s3:prefix:
                      - !Sub
                        "ingress/v1/workspaces/${WorkspaceId}/objects/*"
                  NumericLessThanEquals:
                    s3:max-keys: 1
              - Sid: ReadCanonicalRepository
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/root"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/obj/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/pile/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/failed/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/staged/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/applier/*"
              - Sid: ReadIsolatedIngress
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${IngressBucketName}/ingress/v1/workspaces/${WorkspaceId}/objects/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${IngressBucketName}/ingress/v1/workspaces/${WorkspaceId}/piles/*"
              - Sid: ConditionallyWriteCanonicalRepository
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/root"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/obj/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/pile/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/failed/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/staged/*"
                  - !Sub
                    "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/applier/*"
              - Sid: RetireOnlyInternalPileGenerations
                Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${CanonicalBucketName}/${CanonicalPrefix}/pile/*"
              - !If
                - HasKmsKey
                - Sid: UseRepositoryEncryptionKey
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !Ref KmsKeyArn
                - !Ref AWS::NoValue
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-repository-applier:*"

  RepositoryApplierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-repository-applier"
      CodeUri: stage/
      Handler: deploy.aws_repository_applier.app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Role: !GetAtt RepositoryApplierRole.Arn
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          TINYP2P_UPLOAD_WORKSPACE_ID: !Ref WorkspaceId
          TINYP2P_UPLOAD_CANONICAL_BUCKET: !Ref CanonicalBucketName
          TINYP2P_UPLOAD_CANONICAL_PREFIX: !Ref CanonicalPrefix
          TINYP2P_UPLOAD_INGRESS_BUCKET: !Ref IngressBucketName
          TINYP2P_UPLOAD_EXPECTED_BUCKET_OWNER: !Ref ExpectedBucketOwner
      Events:
        Recovery:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(1 minute)"
            State: ENABLED
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 300

  RepositoryApplierLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub
        "/aws/lambda/${AWS::StackName}-repository-applier"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  DeploymentMarker:
    Value: poc16-aws-repository-applier-v1
  DeploymentId:
    Value: !Ref DeploymentId
  FunctionArn:
    Value: !GetAtt RepositoryApplierFunction.Arn
