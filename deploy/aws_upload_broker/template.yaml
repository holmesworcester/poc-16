AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: POC-16 isolated direct-upload authorization broker

Parameters:
  DeploymentId:
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,63}$"
  WorkspaceId:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
  CanonicalBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^(?!xn--)(?!sthree-)(?![0-9]{1,3}(?:\.[0-9]{1,3}){3}$)(?!.*\.\.)(?!.*(?:-s3alias|--ol-s3|\.mrap|--x-s3|--table-s3)$)[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  CanonicalPrefix:
    Type: String
    MinLength: 1
    MaxLength: 760
    AllowedPattern: '^[a-z0-9:_-][a-z0-9:._-]*(?:/[a-z0-9:_-][a-z0-9:._-]*)*$'
  IngressBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^(?!amzn-s3-demo-)(?!xn--)(?!sthree-)(?!.*(?:-s3alias|--ol-s3|\.mrap|--x-s3|--table-s3)$)[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  ExpectedBucketOwner:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  RepositoryApplierFunctionArn:
    Type: String
    AllowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]{1,64}(?::(?:[A-Za-z0-9_-]+|[0-9]+))?$'
  UploadIssuer:
    Type: String
    MinLength: 1
    MaxLength: 255
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}$'
  UploadKeyringSecretArn:
    Type: String
    AllowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  UploadKeyringVersionId:
    Type: String
    MinLength: 32
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9-]{32,64}$'
  PresignTtlSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 900
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
  LogRetentionDays:
    Type: Number
    Default: 14
  DailyInvocationBudget:
    Type: Number
    Default: 100000
    MinValue: 1
  KmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(?:aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
  AlarmActionArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:[a-z0-9-]+:[^:]*:[^:]*:.+$'

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasAlarmAction: !Not [!Equals [!Ref AlarmActionArn, ""]]

Resources:
  UploadBrokerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttenuateOneWorkspaceUpload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCanonicalAuthorizationSnapshot
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/root"
                    - Bucket: !Ref CanonicalBucketName
                      Prefix: !Ref CanonicalPrefix
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/obj/*"
                    - Bucket: !Ref CanonicalBucketName
                      Prefix: !Ref CanonicalPrefix
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
              - Sid: PresignExactIngressPut
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${IngressBucketName}/ingress/v1/workspaces/${WorkspaceId}/piles/*"
                Condition:
                  Null:
                    s3:if-none-match: "false"
                  NumericLessThanEquals:
                    s3:signatureAge: !Sub "${PresignTtlSeconds}000"
                  StringEquals:
                    s3:ResourceAccount: !Ref ExpectedBucketOwner
                    s3:authType: REST-QUERY-STRING
                    s3:signatureversion: AWS4-HMAC-SHA256
              - Sid: InvokeExactRepositoryApplier
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref RepositoryApplierFunctionArn
              - Sid: ReadUploadSessionKeyring
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref UploadKeyringSecretArn
              - !If
                - HasKmsKey
                - Sid: DecryptDeploymentValues
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref KmsKeyArn
                  Condition:
                    StringEquals:
                      kms:CallerAccount: !Ref AWS::AccountId
                      kms:EncryptionContext:SecretARN:
                        !Ref UploadKeyringSecretArn
                      kms:ViaService: !Sub
                        "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                - !Ref AWS::NoValue
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-upload-broker:*"

  UploadBrokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-upload-broker"
      CodeUri: stage/
      Handler: deploy.aws_upload_broker.app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Role: !GetAtt UploadBrokerRole.Arn
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          TINYP2P_UPLOAD_WORKSPACE_ID: !Ref WorkspaceId
          TINYP2P_UPLOAD_CANONICAL_BUCKET: !Ref CanonicalBucketName
          TINYP2P_UPLOAD_CANONICAL_PREFIX: !Ref CanonicalPrefix
          TINYP2P_UPLOAD_INGRESS_BUCKET: !Ref IngressBucketName
          TINYP2P_UPLOAD_EXPECTED_BUCKET_OWNER: !Ref ExpectedBucketOwner
          TINYP2P_UPLOAD_APPLIER_FUNCTION_ARN: !Ref RepositoryApplierFunctionArn
          TINYP2P_UPLOAD_KEYRING_SECRET_ARN: !Ref UploadKeyringSecretArn
          TINYP2P_UPLOAD_KEYRING_VERSION_ID: !Ref UploadKeyringVersionId
          TINYP2P_UPLOAD_ISSUER: !Ref UploadIssuer
          TINYP2P_UPLOAD_PRESIGN_TTL_SECONDS: !Ref PresignTtlSeconds
          TINYP2P_UPLOAD_FUNCTION_TIMEOUT_SECONDS: "90"
          TINYP2P_UPLOAD_AWS_CONNECT_TIMEOUT_SECONDS: "2"
          TINYP2P_UPLOAD_AWS_READ_TIMEOUT_SECONDS: "70"
          TINYP2P_UPLOAD_AWS_TOTAL_ATTEMPTS: "1"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  UploadBrokerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-upload-broker"
      RetentionInDays: !Ref LogRetentionDays

  UploadBrokerUrl5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: POC-16 upload broker returned a server error
      Namespace: AWS/Lambda
      MetricName: Url5xxCount
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadBrokerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmAction
        - [!Ref AlarmActionArn]
        - !Ref AWS::NoValue

  UploadBrokerDailyInvocationBudget:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: POC-16 upload broker daily budget was exceeded
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadBrokerFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailyInvocationBudget
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmAction
        - [!Ref AlarmActionArn]
        - !Ref AWS::NoValue

Outputs:
  DeploymentMarker:
    Value: poc16-aws-upload-broker-v1
  DeploymentId:
    Value: !Ref DeploymentId
  UploadBrokerUrl:
    Description: Metadata-only upload authorization endpoint
    Value: !GetAtt UploadBrokerFunctionUrl.FunctionUrl
  UploadKeyringSecretArn:
    Description: External secret retained independently from compute teardown
    Value: !Ref UploadKeyringSecretArn
  UploadKeyringVersionId:
    Description: Exact session key-ring generation loaded by this deployment
    Value: !Ref UploadKeyringVersionId
