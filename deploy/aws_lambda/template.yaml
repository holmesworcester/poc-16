AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: POC-16 database-free authorization and immutable-object gateway

Parameters:
  DeploymentId:
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,63}$"
  WorkspaceId:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
  BucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^(?!xn--)(?!sthree-)(?![0-9]{1,3}(?:\.[0-9]{1,3}){3}$)(?!.*\.\.)(?!.*(?:-s3alias|--ol-s3|\.mrap|--x-s3|--table-s3)$)[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  StorePrefix:
    Type: String
    MinLength: 1
    MaxLength: 760
    AllowedPattern: '^[a-z0-9:_-][a-z0-9:._-]*(?:/[a-z0-9:_-][a-z0-9:._-]*)*$'
  ExpectedBucketOwner:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{12}$"
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
  LogRetentionDays:
    Type: Number
    Default: 14
  DailyInvocationBudget:
    Type: Number
    Default: 100000
    MinValue: 1
  KmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(?:aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
  AlarmActionArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:[a-z0-9-]+:[^:]*:[^:]*:.+$'

Conditions:
  HasExpectedOwner: !Not [!Equals [!Ref ExpectedBucketOwner, ""]]
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasAlarmAction: !Not [!Equals [!Ref AlarmActionArn, ""]]

Resources:
  GrantSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Stable HMAC secret shared by every POC-16 Lambda sandbox
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 64

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadOneWorkspace
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DistinguishMissingWorkspaceKeys
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  "arn:${AWS::Partition}:s3:::${BucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${StorePrefix}/root"
                      - !Sub "${StorePrefix}/obj/*"
                      - !Sub "${StorePrefix}/invite/*"
                  NumericLessThanEquals:
                    s3:max-keys: 1
              - Sid: ReadRoot
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/root"
                  - Bucket: !Ref BucketName
                    Prefix: !Ref StorePrefix
              - Sid: ReadImmutableObjects
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/obj/*"
                    - Bucket: !Ref BucketName
                      Prefix: !Ref StorePrefix
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/invite/*"
                    - Bucket: !Ref BucketName
                      Prefix: !Ref StorePrefix
              - Sid: ReadGrantSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GrantSecret
              - !If
                - HasKmsKey
                - Sid: DecryptWorkspaceObjects
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref KmsKeyArn
                - !Ref AWS::NoValue
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-gateway:*"

  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gateway"
      CodeUri: stage/
      Handler: deploy.aws_lambda.app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Role: !GetAtt GatewayRole.Arn
      MemorySize: 512
      Timeout: 15
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          TINYP2P_WORKSPACE_ID: !Ref WorkspaceId
          TINYP2P_S3_BUCKET: !Ref BucketName
          TINYP2P_S3_PREFIX: !Ref StorePrefix
          TINYP2P_EXPECTED_BUCKET_OWNER: !If
            - HasExpectedOwner
            - !Ref ExpectedBucketOwner
            - !Ref AWS::NoValue
          TINYP2P_S3_SERVER_SIDE_ENCRYPTION: !If
            - HasKmsKey
            - "aws:kms"
            - !Ref AWS::NoValue
          TINYP2P_S3_KMS_KEY_ID: !If
            - HasKmsKey
            - !Ref KmsKeyArn
            - !Ref AWS::NoValue
          TINYP2P_GRANT_SECRET_ARN: !Ref GrantSecret
          TINYP2P_FUNCTION_TIMEOUT_SECONDS: "15"
          TINYP2P_AWS_CONNECT_TIMEOUT_SECONDS: "2"
          TINYP2P_AWS_READ_TIMEOUT_SECONDS: "5"
          TINYP2P_AWS_TOTAL_ATTEMPTS: "1"
          TINYP2P_MAX_REQUEST_BYTES: "524288"
          TINYP2P_MAX_ROOT_BYTES: "1048576"
          TINYP2P_MAX_OBJECT_BYTES: "4194304"
          TINYP2P_MAX_BATCH_COUNT: "256"
          TINYP2P_MAX_BATCH_BYTES: "4194304"
          TINYP2P_MINT_MAX_FETCHES: "128"
          TINYP2P_MINT_MAX_FETCH_BYTES: "4194304"
          TINYP2P_GRANT_TTL: "60000"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-gateway"
      RetentionInDays: !Ref LogRetentionDays

  GatewayUrl5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: POC-16 Function URL returned a server error
      Namespace: AWS/Lambda
      MetricName: Url5xxCount
      Dimensions:
        - Name: FunctionName
          Value: !Ref GatewayFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmAction
        - [!Ref AlarmActionArn]
        - !Ref AWS::NoValue

  DailyInvocationBudgetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: POC-16 Lambda daily invocation budget was exceeded
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref GatewayFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailyInvocationBudget
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmAction
        - [!Ref AlarmActionArn]
        - !Ref AWS::NoValue

Outputs:
  DeploymentMarker:
    Description: Marker required by the ownership-checked removal command
    Value: poc16-aws-lambda-gateway-v1
  DeploymentId:
    Description: Stable non-secret identity required for update and removal
    Value: !Ref DeploymentId
  GatewayUrl:
    Description: Public transport endpoint; POC-16 grants authorize data reads
    Value: !GetAtt GatewayFunctionUrl.FunctionUrl
  GrantSecretArn:
    Value: !Ref GrantSecret
