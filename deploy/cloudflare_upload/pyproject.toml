[project]
name = "poc16-cloudflare-upload-boundary"
version = "0.1.0"
description = "Isolated Cloudflare R2 direct-upload broker boundary"
requires-python = ">=3.13"
dependencies = [
    "pynacl==1.5.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "workers-py==1.16.0",
    "workers-runtime-sdk==1.6.3",
]

[tool.pywrangler]
allow-build = false
